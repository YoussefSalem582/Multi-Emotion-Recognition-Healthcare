<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C5BB5" />
      <stop offset="100%" stop-color="#2B4B8C" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="100" y="100" width="824" height="824" rx="200" ry="200" fill="url(#bgGradient)" />
  
  <!-- Headset and speech bubble -->
  <g transform="translate(512, 512) scale(0.65)">
    <!-- Speech bubble -->
    <path d="M-300,-100 C-450,-100 -550,0 -550,150 C-550,300 -450,400 -300,400 L-250,400 L-250,500 C-250,500 -150,400 -100,400 L300,400 C450,400 550,300 550,150 C550,0 450,-100 300,-100 Z" fill="#FFFDF5" />
    
    <!-- Headset -->
    <path d="M-550,150 C-550,150 -650,150 -650,50 C-650,-50 -550,-50 -550,-50 M550,150 C550,150 650,150 650,50 C650,-50 550,-50 550,-50" stroke="#2B4B8C" stroke-width="60" fill="none" stroke-linecap="round" />
    
    <!-- Headset extension to speech bubble -->
    <path d="M550,150 C550,150 550,300 450,400" stroke="#2B4B8C" stroke-width="60" fill="none" stroke-linecap="round" />
    
    <!-- Emoji faces -->
    <!-- Sad emoji -->
    <circle cx="-200" cy="150" r="100" fill="#FFDA44" />
    <circle cx="-230" cy="110" r="15" fill="#2B4B8C" />
    <circle cx="-170" cy="110" r="15" fill="#2B4B8C" />
    <path d="M-250,200 C-250,230 -150,230 -150,200" stroke="#2B4B8C" stroke-width="12" fill="none" stroke-linecap="round" transform="rotate(180 -200 200)" />
    
    <!-- Neutral emoji -->
    <circle cx="0" cy="150" r="100" fill="#FF9811" />
    <circle cx="-30" cy="110" r="15" fill="#2B4B8C" />
    <circle cx="30" cy="110" r="15" fill="#2B4B8C" />
    <line x1="-40" y1="200" x2="40" y2="200" stroke="#2B4B8C" stroke-width="12" stroke-linecap="round" />
    
    <!-- Happy emoji -->
    <circle cx="200" cy="150" r="100" fill="#7ED957" />
    <circle cx="170" cy="110" r="15" fill="#2B4B8C" />
    <circle cx="230" cy="110" r="15" fill="#2B4B8C" />
    <path d="M150,200 C150,230 250,230 250,200" stroke="#2B4B8C" stroke-width="12" fill="none" stroke-linecap="round" />
  </g>
  
  <!-- EmoSense text -->
  <text x="512" y="900" font-family="Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="#FFFFFF">EmoSense</text>
</svg> 